name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Recipes and indexes
        run: |
          pip install --quiet pyyaml
          python scripts/check.py
          python scripts/build_index.py --check

      - name: Rebuild the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "No VERCEL_DEPLOY_HOOK secret; the site keeps its last build."; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Site rebuild requested."
